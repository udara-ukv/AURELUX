name: CI and Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install htmlhint
        run: |
          npm install -g htmlhint

      - name: Run HTML validation (htmlhint)
        run: |
          htmlhint "**/*.html" || true

      - name: Install dev deps
        run: |
          npm ci

      - name: Install Playwright browsers
        run: |
          npx playwright install --with-deps

      - name: Run E2E tests (Playwright)
        run: |
          npm run test:e2e

      - name: Run Lighthouse audit
        run: |
          npm install -g lighthouse
          mkdir -p lighthouse-reports
          lighthouse https://udara-ukv.github.io/AURELUX/ --chrome-flags="--headless" --output-path=./lighthouse-reports/index.html || echo "Lighthouse audit completed"

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: lighthouse-report
          path: lighthouse-reports/
      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: .

  deploy-pages:
    needs: build-and-validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://$GITHUB_REPOSITORY_OWNER.github.io/$GITHUB_REPOSITORY

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
